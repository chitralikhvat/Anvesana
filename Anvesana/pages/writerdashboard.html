<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Anveṣaṇa — Writer Dashboard</title>


<link
    rel="stylesheet"
    href="../style.css"
>


<style>

    body {
        margin: 0;
    }

    .writer-dashboard {
        min-height: 100vh;
        padding: 110px 7% 70px;
    }


    /* HEADER */

    .dashboard-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 25px;
        margin-bottom: 45px;
        flex-wrap: wrap;
    }

    .dashboard-title h1 {
        margin: 0;
        font-size: 42px;
    }

    .dashboard-title p {
        margin: 10px 0 0;
        opacity: 0.7;
    }


    /* BUTTONS */

    .dashboard-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .dashboard-button {
        border: none;
        border-radius: 12px;
        padding: 13px 19px;
        cursor: pointer;
        font-size: 15px;
        transition: 0.2s ease;
    }

    .dashboard-button:hover {
        transform: translateY(-2px);
    }

    .create-button {
        background: #f5d76e;
        color: #11152b;
    }

    .home-button {
        background: rgba(255, 255, 255, 0.08);
        color: inherit;
    }


    /* WORK GRID */

    .works-grid {
        display: grid;
        grid-template-columns:
            repeat(
                auto-fit,
                minmax(280px, 1fr)
            );
        gap: 24px;
    }


    /* WORK CARD */

    .work-card {
        padding: 25px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        transition: 0.25s ease;
    }

    .work-card:hover {
        transform: translateY(-4px);
        border-color: rgba(245, 215, 110, 0.45);
    }

    .work-title {
        margin: 0 0 8px;
        font-size: 23px;
    }

    .work-author {
        margin-bottom: 18px;
        opacity: 0.65;
        font-size: 14px;
    }


    /* BADGES */

    .work-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 22px;
    }

    .badge {
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        font-size: 12px;
    }

    .published {
        color: #a8f0bd;
    }

    .private {
        color: #ffd79a;
    }


    /* CARD BUTTONS */

    .work-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .work-action {
        flex: 1;
        min-width: 100px;
        border: none;
        border-radius: 10px;
        padding: 10px;
        cursor: pointer;
        color: inherit;
        background: rgba(255, 255, 255, 0.09);
    }

    .work-action:hover {
        background: rgba(255, 255, 255, 0.16);
    }

    .delete-action {
        color: #ffaaa5;
    }


    /* EMPTY / LOADING */

    .dashboard-message {
        text-align: center;
        padding: 70px 20px;
        opacity: 0.75;
    }

    .empty-dashboard {
        text-align: center;
        padding: 70px 20px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px dashed rgba(255, 255, 255, 0.15);
    }

    .empty-dashboard h2 {
        margin-bottom: 10px;
    }

    .empty-dashboard p {
        opacity: 0.7;
        margin-bottom: 25px;
    }

    .error-message {
        color: #ffaaa5;
    }


    /* MOBILE */

    @media (max-width: 600px) {

        .writer-dashboard {
            padding-left: 5%;
            padding-right: 5%;
        }

        .dashboard-title h1 {
            font-size: 32px;
        }

        .work-actions {
            flex-direction: column;
        }

    }

</style>
```

</head>

<body>

```
<main class="writer-dashboard">


    <header class="dashboard-header">

        <div class="dashboard-title">

            <h1>
                My Works
            </h1>

            <p id="welcomeText">
                Your little corner of Anveṣaṇa.
            </p>

        </div>


        <div class="dashboard-actions">

            <button
                class="dashboard-button create-button"
                id="createButton"
            >
                ✦ Create New Work
            </button>


            <button
                class="dashboard-button home-button"
                id="homeButton"
            >
                ← Home
            </button>

        </div>

    </header>


    <section
        class="works-grid"
        id="worksGrid"
    >

        <div class="dashboard-message">

            Loading your works...

        </div>

    </section>


</main>


<!-- SUPABASE LIBRARY -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- YOUR MAIN SCRIPT -->

<script src="../script.js"></script>


<!-- DASHBOARD SCRIPT -->

<script>

    /* ========================================
       SUPABASE CLIENT
    ======================================== */

    const db = window.db;


    /* ========================================
       ELEMENTS
    ======================================== */

    const worksGrid =
        document.getElementById(
            "worksGrid"
        );


    const welcomeText =
        document.getElementById(
            "welcomeText"
        );


    const createButton =
        document.getElementById(
            "createButton"
        );


    const homeButton =
        document.getElementById(
            "homeButton"
        );


    /* ========================================
       CHECK SUPABASE
    ======================================== */

    if (!db) {

        worksGrid.innerHTML = `

            <div class="dashboard-message error-message">

                <strong>
                    Supabase could not be loaded.
                </strong>

                <br><br>

                Your main script.js did not create
                <code>window.db</code>.

                <br><br>

                Make sure your script.js contains:

                <br><br>

                <code>
                    window.db =
                    window.supabase.createClient(...);
                </code>

            </div>

        `;

        throw new Error(
            "window.db is not available."
        );

    }


    /* ========================================
       NAVIGATION
    ======================================== */

    homeButton.addEventListener(
        "click",
        function () {

            window.location.href =
                "../index.html";

        }
    );


    createButton.addEventListener(
        "click",
        function () {

            window.location.href =
                "write.html";

        }
    );


    /* ========================================
       LOAD DASHBOARD
    ======================================== */

    async function loadDashboard() {


        /* GET CURRENT USER */

        const {
            data: {
                user
            },
            error: userError
        } =
            await db.auth.getUser();


        /* NOT LOGGED IN */

        if (
            userError ||
            !user
        ) {

            createButton.style.display =
                "none";


            worksGrid.innerHTML = `

                <div class="empty-dashboard">

                    <h2>
                        You aren't logged in
                    </h2>

                    <p>
                        Log in to access your writer dashboard.
                    </p>

                    <button
                        class="dashboard-button create-button"
                        id="loginButton"
                    >
                        Log In
                    </button>

                </div>

            `;


            document
                .getElementById(
                    "loginButton"
                )
                .addEventListener(
                    "click",
                    function () {

                        window.location.href =
                            "../login.html";

                    }
                );


            return;

        }


        /* WELCOME */

        welcomeText.textContent =
            "Signed in as " +
            (
                user.email ||
                "writer"
            );


        /* GET USER'S WRITINGS */

        const {
            data: writings,
            error: writingsError
        } =
            await db
                .from("Writings")
                .select(
                    "id, title, author, published, created_at"
                )
                .eq(
                    "user_id",
                    user.id
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        /* DATABASE ERROR */

        if (writingsError) {

            console.error(
                "Writer dashboard error:",
                writingsError
            );


            worksGrid.innerHTML = `

                <div class="dashboard-message error-message">

                    <strong>
                        Couldn't load your works.
                    </strong>

                    <br><br>

                    ${escapeHTML(
                        writingsError.message
                    )}

                </div>

            `;


            return;

        }


        /* NO WORKS */

        if (
            !writings ||
            writings.length === 0
        ) {

            worksGrid.innerHTML = `

                <div class="empty-dashboard">

                    <h2>
                        Your shelves are empty ✦
                    </h2>

                    <p>
                        Create your first work and it will appear here.
                    </p>

                    <button
                        class="dashboard-button create-button"
                        id="emptyCreateButton"
                    >
                        ✦ Create New Work
                    </button>

                </div>

            `;


            document
                .getElementById(
                    "emptyCreateButton"
                )
                .addEventListener(
                    "click",
                    function () {

                        window.location.href =
                            "write.html";

                    }
                );


            return;

        }


        /* CLEAR LOADING */

        worksGrid.innerHTML = "";


        /* CREATE CARDS */

        writings.forEach(
            function (writing) {


                const status =
                    writing.published
                        ? "Published"
                        : "Private";


                const statusClass =
                    writing.published
                        ? "published"
                        : "private";


                const date =
                    writing.created_at
                        ? new Date(
                            writing.created_at
                        ).toLocaleDateString(
                            undefined,
                            {
                                year:
                                    "numeric",
                                month:
                                    "short",
                                day:
                                    "numeric"
                            }
                        )
                        : "Unknown";


                const card =
                    document.createElement(
                        "article"
                    );


                card.className =
                    "work-card";


                card.innerHTML = `

                    <h2 class="work-title">

                        ${escapeHTML(
                            writing.title ||
                            "Untitled Work"
                        )}

                    </h2>


                    <div class="work-author">

                        by
                        ${escapeHTML(
                            writing.author ||
                            "Anonymous"
                        )}

                    </div>


                    <div class="work-meta">

                        <span
                            class="badge ${statusClass}"
                        >
                            ${status}
                        </span>


                        <span
                            class="badge"
                        >
                            ✦ Work
                        </span>


                        <span
                            class="badge"
                        >
                            ${date}
                        </span>

                    </div>


                    <div class="work-actions">

                        <button
                            class="work-action chapters-button"
                            data-id="${writing.id}"
                        >
                            📑 Chapters
                        </button>


                        <button
                            class="work-action edit-button"
                            data-id="${writing.id}"
                        >
                            ✏️ Edit
                        </button>


                        <button
                            class="work-action delete-action delete-button"
                            data-id="${writing.id}"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                `;


                worksGrid.appendChild(
                    card
                );

            }
        );


        /* CHAPTER BUTTONS */

        document
            .querySelectorAll(
                ".chapters-button"
            )
            .forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            const id =
                                button.dataset.id;


                            window.location.href =
                                "chapters.html?id=" +
                                encodeURIComponent(
                                    id
                                );

                        }
                    );

                }
            );


        /* EDIT BUTTONS */

        document
            .querySelectorAll(
                ".edit-button"
            )
            .forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            const id =
                                button.dataset.id;


                            window.location.href =
                                "editwork.html?id=" +
                                encodeURIComponent(
                                    id
                                );

                        }
                    );

                }
            );


        /* DELETE BUTTONS */

        document
            .querySelectorAll(
                ".delete-button"
            )
            .forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        async function () {


                            const id =
                                button.dataset.id;


                            const confirmed =
                                window.confirm(
                                    "Are you sure you want to delete this work?"
                                );


                            if (
                                !confirmed
                            ) {

                                return;

                            }


                            button.disabled =
                                true;


                            button.textContent =
                                "Deleting...";


                            const {
                                error
                            } =
                                await db
                                    .from(
                                        "Writings"
                                    )
                                    .delete()
                                    .eq(
                                        "id",
                                        id
                                    );


                            if (error) {

                                console.error(
                                    "Delete error:",
                                    error
                                );


                                alert(
                                    "Could not delete this work: " +
                                    error.message
                                );


                                button.disabled =
                                    false;


                                button.textContent =
                                    "🗑️ Delete";


                                return;

                            }


                            loadDashboard();

                        }
                    );

                }
            );

    }


    /* ========================================
       ESCAPE HTML
    ======================================== */

    function escapeHTML(
        value
    ) {

        return String(
            value
        )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* ========================================
       START
    ======================================== */

    loadDashboard();

</script>
```
