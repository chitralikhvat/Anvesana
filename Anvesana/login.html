<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Log in — Anveṣaṇa</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body class="account-page">


    <main class="account-page-container">


        <a
            href="index.html"
            class="account-back">

            ← Back to Anveṣaṇa

        </a>


        <section class="account-card">


            <!-- SATURN -->

            <div
                class="login-planet"
                aria-hidden="true">

                <div class="login-planet-stars">
                    ✦ · ˚ ✧ ·
                </div>

                <div class="login-planet-ring ring-one"></div>

                <div class="login-planet-ring ring-two"></div>

                <div class="login-planet-body"></div>

            </div>


            <p class="account-eyebrow">

                ✦ YOUR LITTLE UNIVERSE

            </p>


            <h1>

                Welcome back

            </h1>


            <p class="account-page-intro">

                Return to your little universe
                of curiosity.

            </p>


            <form id="loginForm">


                <label
                    for="loginEmail">

                    Email

                </label>


                <input
                    id="loginEmail"
                    type="email"
                    placeholder="Your email"
                    autocomplete="email"
                    required>


                <label
                    for="loginPassword">

                    Password

                </label>


                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Your password"
                    autocomplete="current-password"
                    required>


                <button
                    id="loginButton"
                    class="account-page-button"
                    type="submit">

                    Log in

                </button>


                <p
                    id="loginMessage"
                    class="account-page-message"
                    aria-live="polite">
                </p>


            </form>


            <p class="account-switch">

                Don't have an account?

                <a href="signup.html">
                    Create one
                </a>

            </p>


        </section>


    </main>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>


</body>

</html>
